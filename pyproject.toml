[project]
name = "mercury"
version = "0.2.0"
description = "Autonomous Trading Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5.42",
    "nats-py>=2.14.0",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    # Challenge 1 — L2 order book (O(log n) price-level ops)
    "sortedcontainers>=2.4.0",
    # Challenge 2 — stateful stream processing
    "bytewax>=0.21.0",
    # Challenge 3 — distributed backtesting
    "ray>=2.40.0",
    "lance>=0.27.0",
    # Challenge 4 — zero-copy Arrow pipeline
    "pyarrow>=19.0.0",
    "polars>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "RUF002",  # ambiguous Unicode in docstrings — intentional (×, –)
    "B905",    # zip strict= — not needed for short internal iterables
]

[tool.ruff.lint.isort]
known-first-party = ["core", "brain", "executor", "plutarch", "backtesting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"

# Permissive baseline; tighten incrementally during M2.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["\\.venv", "build", "dist"]
