[project]
name = "mercury"
version = "0.2.0"
description = "Observation-first crypto market research system"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5.70",
    "nats-py>=2.14.0",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    # Challenge 1 — L2 order book (O(log n) price-level ops)
    "sortedcontainers>=2.4.0",
    # Challenge 2 — stateful stream processing
    "bytewax>=0.21.0",
    # Challenge 3 — distributed backtesting
    "ray>=2.40.0",
    "pylance>=0.27.0",
    # Challenge 4 — zero-copy Arrow pipeline
    "pyarrow>=19.0.0",
    "polars>=1.0.0",
]

[project.urls]
Repository = "https://github.com/AndreaBozzo/Mercury"
Issues = "https://github.com/AndreaBozzo/Mercury/issues"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backtesting*", "brain*", "core*", "executor*", "plutarch*", "scripts*"]
exclude = ["tests*"]

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "mypy>=1.13.0",
    "types-requests>=2.32.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "RUF002",  # ambiguous Unicode in docstrings — intentional (×, –)
    "B905",    # zip strict= — not needed for short internal iterables
]

[tool.ruff.lint.isort]
known-first-party = ["core", "brain", "executor", "plutarch", "backtesting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"
markers = [
    "integration: requires an external service such as a real NATS JetStream server",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["\\.venv", "build", "dist", "tests"]
