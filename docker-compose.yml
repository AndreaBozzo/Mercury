version: '3.8'

services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"
    # JetStream needs an on-disk store to survive container restarts.
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data

  brain:
    build:
      context: .
      dockerfile: brain/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats

  executor:
    build:
      context: .
      dockerfile: executor/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
    env_file:
      - .env
    depends_on:
      - nats

  plutarch:
    build:
      context: .
      dockerfile: plutarch/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
      - PLUTARCH_DATA_DIR=/data/history
      - PLUTARCH_QUARANTINE_DIR=/data/quarantine
      - PLUTARCH_HTTP_HOST=0.0.0.0
    ports:
      - "9110:9110"
    volumes:
      - plutarch-data:/data
    depends_on:
      - nats

volumes:
  nats-data:
  plutarch-data:
