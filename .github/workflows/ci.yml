name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Start pinned NATS JetStream
        run: |
          docker run --detach --name mercury-ci-nats \
            --publish 127.0.0.1:4222:4222 \
            --publish 127.0.0.1:8222:8222 \
            nats:2.14.3-alpine3.22@sha256:c11af972c99ae542de8925e6a7d9c533aa1eb039660420d2074beed6089b3bf0 \
            -js -m 8222
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              "http://127.0.0.1:8222/healthz?js-enabled-only=true" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs mercury-ci-nats
          exit 1

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy core brain executor plutarch backtesting scripts

      - name: Run tests
        run: uv run pytest
        env:
          MERCURY_INTEGRATION_NATS_URL: nats://127.0.0.1:4222

      - name: Build distributions
        run: uv build

      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt \
            --output-file .audit-requirements.txt
          uv run pip-audit --requirement .audit-requirements.txt

      - name: Record distribution checksums
        run: |
          (
            cd dist
            sha256sum *.tar.gz *.whl > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mercury-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Stop NATS
        if: always()
        run: docker rm --force mercury-ci-nats
